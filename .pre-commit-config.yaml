# Runs before every `git commit`. Install once with: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks          # blocks commits that contain secrets
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: commit-rules
        name: commit message and branch rules
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
