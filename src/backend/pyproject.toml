[project]
name = "auditwake-backend"
version = "0.1.0"
description = "Auditwake backend: audit log, tracing and storage. Never imports the agents project (ADR-0011)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditwake_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
