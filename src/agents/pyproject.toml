[project]
name = "auditwake-agents"
version = "0.1.0"
description = "Auditwake agents: profiles, MCP tools, model access, guardrails and evals. Depends on the backend project (ADR-0011)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["auditwake-backend"]

[dependency-groups]
dev = ["pytest>=9.2", "mypy>=2.4.1", "ruff==0.17.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditwake_agents"]

[tool.uv.sources]
auditwake-backend = { path = "../backend", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["auditwake_agents"]
