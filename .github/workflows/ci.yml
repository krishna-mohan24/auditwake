name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # the gitleaks action lists pull request commits
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0    # scan the full history
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Ruff lint
        run: uvx ruff@0.17.6 check .
      - name: Ruff format check
        run: uvx ruff@0.17.6 format --check .
      - name: Rule tests
        run: uvx pytest -q tests/unit/test_commit_rules.py
  naming:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Branch name and PR title
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 pipelines/check_pr_meta.py
