[project]
name = "auditwake"
version = "0.1.0"
description = "Flight recorder and governance layer for AI agents (produces audit evidence)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditwake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
